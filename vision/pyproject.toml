[project]
name = "lab-vision"
version = "0.1.0"
description = "Protocol-aware lab video monitoring that flags deviations from an experimental protocol"
requires-python = ">=3.13"
dependencies = [
  "anthropic>=1.11,<2",
  "opencv-python-headless>=4.10,<5",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "pyyaml>=6,<7",
]

[project.optional-dependencies]
detection = [
  "pillow>=10",
  "torch>=2.4",
  "transformers>=4.45",
]
dev = [
  "pytest>=8,<9",
  "ruff>=0.9",
]

[project.scripts]
lab-vision = "lab_vision.cli:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
